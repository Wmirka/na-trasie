<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b45">
  <meta name="description" content="Na Trasie – zbieraj pieczątki turystyczne z całej Polski, rozwijaj swoją kolekcję i zdobywaj kolejne poziomy.">
  <title>Na Trasie – Twoja podróż, Twoja kolekcja</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23176b45'/%3E%3Cpath d='M25 68 45 27l12 25 8-15 13 31H25Z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --green:#176b45;
      --green-dark:#105337;
      --green-light:#eaf5ee;
      --ink:#18251e;
      --muted:#718078;
      --line:#e8eee9;
      --bg:#f7f9f7;
      --white:#fff;
      --gold:#d49a32;
      --red:#c34c4c;
      --shadow:0 12px 36px rgba(24,55,37,.07);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;font-size:15px}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20}
    .topbar-inner{width:min(1180px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.8px}
    .brand-mark{width:39px;height:39px;background:var(--green);border-radius:13px;display:grid;place-items:center;color:white}
    .brand-mark svg{width:23px;height:23px}
    .nav{display:flex;align-items:center;gap:5px}
    .nav button{border:0;background:transparent;color:#69766e;padding:11px 13px;border-radius:11px;font-weight:600;font-size:13px}
    .nav button:hover,.nav button.active{background:var(--green-light);color:var(--green)}
    .nav-right{display:flex;align-items:center;gap:10px}
    .user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:30px;padding:6px 12px 6px 6px;font-size:13px;font-weight:700}
    .avatar{width:31px;height:31px;border-radius:50%;background:var(--green-light);color:var(--green);display:grid;place-items:center;font-weight:800}
    .btn{border:0;border-radius:12px;padding:12px 17px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--green);color:white;box-shadow:0 5px 14px rgba(23,107,69,.15)}
    .btn-primary:hover{background:var(--green-dark);transform:translateY(-1px)}
    .btn-secondary{background:var(--green-light);color:var(--green)}
    .btn-outline{background:white;color:var(--ink);border:1px solid var(--line)}
    .btn-danger{background:#fff0f0;color:var(--red)}
    .btn-small{padding:9px 12px;font-size:12px;border-radius:9px}
    main{width:min(1180px,calc(100% - 40px));margin:34px auto 70px;min-height:65vh}
    .hero{background:linear-gradient(115deg,#104d34 0%,#176b45 58%,#2c8057 100%);color:white;border-radius:28px;padding:54px 55px;position:relative;overflow:hidden;min-height:350px;display:flex;align-items:center}
    .hero:after{content:"";position:absolute;width:430px;height:430px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-75px;top:-115px;box-shadow:0 0 0 45px rgba(255,255,255,.035),0 0 0 95px rgba(255,255,255,.025)}
    .hero-content{max-width:600px;position:relative;z-index:1}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;opacity:.75;margin-bottom:17px}
    h1,h2,h3,p{margin-top:0}
    .hero h1{font:800 clamp(34px,5vw,57px)/1.08 Manrope,sans-serif;letter-spacing:-2.5px;margin:0 0 18px}
    .hero p{font-size:16px;line-height:1.7;color:rgba(255,255,255,.8);max-width:500px;margin-bottom:26px}
    .hero .btn{background:white;color:var(--green);padding:14px 20px}
    .hero-note{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.72);margin-top:17px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:39px 0 18px}
    .section-head h2{font:800 23px Manrope,sans-serif;letter-spacing:-.7px;margin:0 0 5px}
    .section-head p{color:var(--muted);font-size:13px;margin:0}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:22px}
    .stat,.panel,.stamp-card,.feature-card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px rgba(24,55,37,.025)}
    .stat{padding:20px 22px}
    .stat-label{font-size:12px;color:var(--muted);font-weight:600}
    .stat-value{font:800 28px Manrope,sans-serif;margin:8px 0 3px;letter-spacing:-1px}
    .stat-sub{font-size:11px;color:#94a098}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .feature-card{padding:22px}
    .feature-icon{width:43px;height:43px;border-radius:14px;background:var(--green-light);color:var(--green);display:grid;place-items:center;font-size:20px;margin-bottom:17px}
    .feature-card h3{font:700 16px Manrope,sans-serif;margin-bottom:8px}
    .feature-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
    .page-title{font:800 31px Manrope,sans-serif;letter-spacing:-1.3px;margin:0 0 8px}
    .page-desc{color:var(--muted);margin:0 0 27px;line-height:1.6}
    .panel{padding:25px;margin-bottom:18px}
    .panel h3{font:800 17px Manrope,sans-serif;margin-bottom:7px}
    .panel-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-size:12px;font-weight:700;color:#536158}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dfe7e1;border-radius:11px;padding:12px 13px;background:white;color:var(--ink);outline:none}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(23,107,69,.08)}
    .field textarea{min-height:90px;resize:vertical}
    .help{font-size:11px;color:var(--muted);line-height:1.5}
    .auth-wrap{max-width:480px;margin:35px auto}
    .auth-card{background:white;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}
    .auth-card h1{font:800 27px Manrope,sans-serif;letter-spacing:-1px;margin-bottom:8px}
    .auth-card>p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px}
    .auth-card .field{margin-bottom:15px}
    .auth-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
    .auth-foot button{border:0;background:none;color:var(--green);font-weight:800}
    .notice{padding:13px 15px;border-radius:11px;background:#eff7f1;color:var(--green);font-size:12px;line-height:1.5;margin:15px 0}
    .notice.error{background:#fff0f0;color:var(--red)}
    .stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
    .stamp-card{overflow:hidden}
    .stamp-photo{height:190px;background:#edf2ee;display:grid;place-items:center;overflow:hidden;color:#9aaa9f}
    .stamp-photo img{width:100%;height:100%;object-fit:cover}
    .stamp-body{padding:17px}
    .stamp-body h3{font:700 15px Manrope,sans-serif;margin:0 0 6px}
    .stamp-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
    .status{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800}
    .status.approved{background:#e9f6ed;color:#287447}
    .status.pending{background:#fff5df;color:#9a6a15}
    .status.rejected{background:#fff0f0;color:#b64a4a}
    .status.review{background:#edf2ff;color:#4d62a5}
    .empty{padding:44px 20px;text-align:center;background:white;border:1px dashed #d9e3dc;border-radius:18px;color:var(--muted)}
    .empty-icon{font-size:30px;margin-bottom:12px}
    .empty h3{color:var(--ink);font:700 16px Manrope,sans-serif;margin-bottom:7px}
    .empty p{font-size:12px;line-height:1.6;margin:0 auto 16px;max-width:360px}
    .profile-head{display:flex;align-items:center;gap:20px;padding:25px}
    .profile-avatar{width:72px;height:72px;border-radius:23px;background:var(--green-light);color:var(--green);display:grid;place-items:center;font:800 27px Manrope}
    .profile-name{font:800 24px Manrope;margin:0 0 5px}
    .profile-info{color:var(--muted);font-size:12px}
    .progress{height:9px;background:#edf1ed;border-radius:20px;overflow:hidden;margin:13px 0 7px}
    .progress span{height:100%;display:block;background:linear-gradient(90deg,#176b45,#59a878);border-radius:20px}
    .progress-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
    .table-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%;font-size:12px}
    th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:12px;border-bottom:1px solid var(--line)}
    td{padding:14px 12px;border-bottom:1px solid #f0f3f0}
    tr:last-child td{border-bottom:0}
    .rank-number{font:800 15px Manrope;color:#8c9a90}
    .rank-user{display:flex;align-items:center;gap:10px;font-weight:700}
    .rank-avatar{width:31px;height:31px;border-radius:50%;background:var(--green-light);color:var(--green);display:grid;place-items:center;font-weight:800}
    .update-card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:13px}
    .update-date{font-size:11px;color:var(--green);font-weight:800;margin-bottom:9px}
    .update-card h3{font:800 17px Manrope;margin:0 0 8px}
    .update-card p{font-size:13px;line-height:1.7;color:var(--muted);white-space:pre-wrap;margin:0}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .admin-stamp{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .admin-stamp:last-child{border:0}
    .admin-thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#edf2ee}
    .admin-stamp-info{flex:1;min-width:0}
    .admin-stamp-info strong{display:block;font-size:12px;margin-bottom:4px}
    .admin-stamp-info small{color:var(--muted);font-size:10px}
    .admin-actions{display:flex;gap:6px;flex-wrap:wrap}
    .footer{border-top:1px solid var(--line);background:white;padding:27px 20px}
    .footer-inner{width:min(1180px,100%);margin:auto;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}
    .toast{position:fixed;bottom:22px;right:22px;z-index:60;background:#18251e;color:white;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(380px,calc(100% - 44px))}
    .toast.bad{background:#9e3737}
    .loading{padding:45px;text-align:center;color:var(--muted);font-size:13px}
    .mobile-menu{display:none}
    @media(max-width:850px){
      .nav{gap:0}.nav button{padding:10px 8px;font-size:11px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .stamp-grid{grid-template-columns:repeat(2,1fr)}
      .hero{padding:42px 35px}
    }
    @media(max-width:650px){
      .topbar{height:auto;min-height:66px}.topbar-inner{width:calc(100% - 28px);flex-wrap:wrap;padding:12px 0;gap:10px}
      .brand{font-size:19px}.nav{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
      .nav button{white-space:nowrap;padding:9px 11px}
      .nav-right{margin-left:auto}.user-chip span:last-child{display:none}
      main{width:calc(100% - 28px);margin:22px auto 50px}
      .hero{padding:35px 25px;min-height:340px;border-radius:22px}
      .hero h1{letter-spacing:-1.6px}.hero p{font-size:14px}
      .features{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:16px}
      .stat-value{font-size:24px}.stamp-grid{grid-template-columns:1fr 1fr;gap:10px}
      .stamp-photo{height:135px}.stamp-body{padding:12px}.stamp-body h3{font-size:13px}
      .form-grid,.admin-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
      .auth-card{padding:25px 21px}.panel{padding:19px}
      .profile-head{padding:18px;gap:14px}.profile-avatar{width:58px;height:58px}
      .profile-name{font-size:20px}.footer-inner{flex-direction:column}
      .section-head{align-items:start;flex-direction:column}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Na Trasie – strona główna">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 19 7-14 4 8 2-4 5 10H3Z"/><path d="M7 19h10"/></svg>
        </span>
        Na Trasie
      </a>
      <nav class="nav" id="navigation">
        <button data-route="/" class="active">Start</button>
        <button data-route="/ranking">Ranking</button>
        <button data-route="/aktualnosci">Aktualności</button>
        <button data-route="/ksiazeczka">Książeczka</button>
      </nav>
      <div class="nav-right" id="navRight">
        <button class="btn btn-primary btn-small" onclick="go('/logowanie')">Zaloguj się</button>
      </div>
    </div>
  </header>

  <main id="appMain">
    <div class="loading">Ładowanie Na Trasie…</div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div><strong style="color:var(--green)">Na Trasie</strong> · Twoja podróż, Twoja kolekcja.</div>
      <div>Odkrywaj Polskę. Zbieraj wspomnienia. Zdobywaj pieczątki.</div>
    </div>
  </footer>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
/* ==========================================================
   NA TRASIE – KONFIGURACJA
   Wklej tutaj swój klucz publishable/anon z Supabase.
   NIGDY nie wklejaj tutaj klucza service_role ani klucza AI.
   ========================================================== */
const SUPABASE_URL = "https://lpvmvgwbefboamdrjvqv.supabase.co";
const SUPABASE_KEY = "WKLEJ_TUTAJ_KLUCZ_PUBLISHABLE";

const supabaseReady =
  SUPABASE_KEY !== "WKLEJ_TUTAJ_KLUCZ_PUBLISHABLE" &&
  SUPABASE_KEY.length > 20 &&
  window.supabase;

const db = supabaseReady
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const BUCKET = "stamp-photos";
const state = {
  session:null, user:null, profile:null, stamps:[], updates:[],
  ranking:[], achievements:[], route:"/", authEmail:"", authMode:"login",
  selectedFile:null, adminStamps:[]
};

const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
const datePL = (value) => value ? new Date(value).toLocaleDateString("pl-PL") : "—";
const initials = (name) => (name || "?").trim().slice(0,2).toUpperCase();

function toast(message, bad=false) {
  const el=$("#toast");
  el.textContent=message;
  el.classList.remove("hidden","bad");
  if(bad) el.classList.add("bad");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.add("hidden"),4200);
}
function go(route) {
  location.hash = route === "/" ? "/" : route;
}
function currentRoute() {
  const route=location.hash.replace(/^#/, "") || "/";
  return route.split("?")[0];
}
function setNav() {
  const route=state.route;
  document.querySelectorAll("[data-route]").forEach(b=>{
    b.classList.toggle("active",b.dataset.route===route);
  });
  const right=$("#navRight");
  if(state.user) {
    right.innerHTML=`
      <button class="user-chip" onclick="go('/profil')">
        <span class="avatar">${esc(initials(state.profile?.nickname || state.user.email))}</span>
        <span>${esc(state.profile?.nickname || "Moje konto")}</span>
      </button>
      <button class="btn btn-outline btn-small" onclick="logout()">Wyloguj</button>`;
    if(state.profile?.role==="admin") {
      right.insertAdjacentHTML("afterbegin",`<button class="btn btn-secondary btn-small" onclick="go('/admin')">Panel</button>`);
    }
  } else {
    right.innerHTML=`<button class="btn btn-primary btn-small" onclick="go('/logowanie')">Zaloguj się</button>`;
  }
}
function needConfig() {
  if(!db) {
    $("#appMain").innerHTML=`
      <div class="auth-wrap"><div class="auth-card">
        <h1>Jeszcze chwila!</h1>
        <p>Strona wymaga klucza publicznego Supabase. W pliku <strong>index.html</strong> znajdź sekcję „KONFIGURACJA” i zastąp tekst <strong>WKLEJ_TUTAJ_KLUCZ_PUBLISHABLE</strong> swoim kluczem publishable.</p>
        <div class="notice">Klucz publiczny (publishable/anon) jest przeznaczony do użycia na stronie. Nie wklejaj klucza service_role.</div>
      </div></div>`;
    return true;
  }
  return false;
}

async function refreshSession() {
  if(!db) return;
  const {data,error}=await db.auth.getSession();
  if(error) console.error(error);
  state.session=data?.session || null;
  state.user=state.session?.user || null;
  if(state.user) await loadProfile();
  else state.profile=null;
}
async function loadProfile() {
  if(!state.user) return;
  const {data,error}=await db.from("profiles").select("*").eq("id",state.user.id).maybeSingle();
  if(error) { console.error(error); return; }
  state.profile=data;
}
async function loadStamps() {
  if(!state.user) {state.stamps=[];return;}
  const {data,error}=await db.from("stamps")
    .select("id,place_name,region,acquired_at,status,photo_path,created_at,ai_note")
    .eq("user_id",state.user.id).order("created_at",{ascending:false});
  if(error) {console.error(error);state.stamps=[];return;}
  state.stamps=data||[];
}
async function loadUpdates() {
  const {data,error}=await db.from("updates").select("*")
    .eq("published",true).order("created_at",{ascending:false});
  if(error){console.error(error);state.updates=[];return;}
  state.updates=data||[];
}
async function loadRanking() {
  const {data,error}=await db.from("profiles")
    .select("id,nickname,level,stamp_count")
    .order("stamp_count",{ascending:false}).limit(50);
  if(error){console.error(error);state.ranking=[];return;}
  state.ranking=data||[];
}
async function loadAchievements() {
  if(!state.user){state.achievements=[];return;}
  const {data,error}=await db.from("user_achievements")
    .select("achievement_id,earned_at,achievements(name,description,icon)")
    .eq("user_id",state.user.id);
  if(error){console.error(error);state.achievements=[];return;}
  state.achievements=data||[];
}
async function signedPhoto(path) {
  if(!path) return "";
  const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);
  if(error){console.error(error);return "";}
  return data?.signedUrl||"";
}
async function logout() {
  const {error}=await db.auth.signOut();
  if(error){toast(error.message,true);return;}
  state.user=null;state.profile=null;state.stamps=[];
  toast("Wylogowano.");
  go("/");
}

function homePage() {
  const count=state.profile?.stamp_count ?? "—";
  const level=state.profile?.level ?? "—";
  $("#appMain").innerHTML=`
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Polska czeka na odkrycie</div>
        <h1>Każda trasa<br>zostawia ślad.</h1>
        <p>Zbieraj pieczątki turystyczne z całej Polski, twórz własną kolekcję i sprawdzaj, dokąd zaprowadzi Cię kolejna przygoda.</p>
        <button class="btn" onclick="go('${state.user?"/ksiazeczka":"/rejestracja"}')">${state.user?"Otwórz swoją książeczkę":"Dołącz do Na Trasie"} <span>→</span></button>
        <div class="hero-note">✦ Cała Polska · Wirtualna książeczka · Wspólna przygoda</div>
      </div>
    </section>
    <section class="stats">

async function sendOtp(event) {
  event.preventDefault();
  const form=event.currentTarget;
  const email=form.email.value.trim().toLowerCase();
  const nickname=form.nickname?.value.trim();
  if(state.authMode==="register" && (!nickname||nickname.length<3)) {
    toast("Nick musi mieć co najmniej 3 znaki.",true);return;
  }
  const notice=$("#authNotice");
  notice.innerHTML=`<div class="notice">Wysyłanie kodu…</div>`;
  if(state.authMode==="register") {
    const {data:existing,error:checkError}=await db.from("profiles")
      .select("id").ilike("nickname",nickname).limit(1);
    if(checkError){notice.innerHTML=`<div class="notice error">Nie udało się sprawdzić nicku. Spróbuj ponownie.</div>`;return;}
    if(existing?.length){notice.innerHTML=`<div class="notice error">Ten nick jest już zajęty. Wybierz inny.</div>`;return;}
    sessionStorage.setItem("naTrasiePendingNickname",nickname);
  }
  const {error}=await db.auth.signInWithOtp({
    email,
    options:{shouldCreateUser:state.authMode==="register"}
  });
  if(error) {
    notice.innerHTML=`<div class="notice error">${esc(error.message)}<br>Jeśli próbowałeś wiele razy, odczekaj przed kolejną próbą.</div>`;
    return;
  }
  state.authEmail=email;
  $("#authForm").classList.add("hidden");
  $("#otpForm").classList.remove("hidden");
  $("#sentEmail").textContent=email;
  notice.innerHTML="";
  $("#otp").focus();
}
function backToEmail() {
  $("#otpForm").classList.add("hidden");
  $("#authForm").classList.remove("hidden");
}
async function verifyOtp(event) {
  event.preventDefault();
  const token=$("#otp").value.trim();
  if(!/^\d{6}$/.test(token)){toast("Wpisz sześciocyfrowy kod.",true);return;}
  const {data,error}=await db.auth.verifyOtp({
    email:state.authEmail,token,type:"email"
  });
  if(error){toast("Kod nieprawidłowy lub wygasł: "+error.message,true);return;}
  state.session=data.session;state.user=data.user;
  await ensureProfile();
  await refreshSession();
  toast("Zalogowano pomyślnie. Witaj na trasie!");
  go("/");
}
async function ensureProfile() {
  if(!state.user)return;
  const nickname=sessionStorage.getItem("naTrasiePendingNickname");
  const {data:profile}=await db.from("profiles").select("id").eq("id",state.user.id).maybeSingle();
  if(!profile) {
    const base=nickname || (state.user.email||"Odkrywca").split("@")[0];
    const {error}=await db.from("profiles").insert({
      id:state.user.id,nickname:base.slice(0,24)
    });
    if(error) {
      console.error(error);
      toast("Konto powstało, ale nie udało się utworzyć profilu. Skontaktuj się z administratorem.",true);
    }
  }
  sessionStorage.removeItem("naTrasiePendingNickname");
}

async function submitStamp(event) {
  event.preventDefault();
  const form=event.currentTarget;
  const file=form.photo.files[0];
  if(!file){toast("Wybierz zdjęcie.",true);return;}
  const button=form.querySelector("button[type=submit]");
  button.disabled=true;button.textContent="Wysyłanie…";
  try {
    const ext=file.name.split(".").pop().toLowerCase();
    const path=`${state.user.id}/${crypto.randomUUID()}.${ext}`;
    const upload=await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
    if(upload.error)throw upload.error;
    const insert=await db.from("stamps").insert({
      user_id:state.user.id,
      place_name:form.place.value.trim(),
      region:form.region.value||null,
      acquired_at:form.acquired.value,
      photo_path:path,
      status:"pending"
    }).select("id").single();
    if(insert.error) {
      await db.storage.from(BUCKET).remove([path]);
      throw insert.error;
    }
    toast("Pieczątka dodana! Czeka na sprawdzenie.");
    await loadStamps();
    go("/ksiazeczka");
    // Próba uruchomienia funkcji TRASIK AI. Brak funkcji oznacza ręczną weryfikację.
    db.functions.invoke("trasik-check",{body:{stamp_id:insert.data.id}})
      .then(({error})=>{if(error)console.warn("TRASIK AI: zgłoszenie pozostaje do ręcznej kontroli.",error);})
      .catch(err=>console.warn(err));
  } catch(error) {
    console.error(error);toast("Nie udało się dodać pieczątki: "+(error.message||"błąd"),true);
    button.disabled=false;button.textContent="Wyślij pieczątkę do sprawdzenia →";
  }
}

async function moderateStamp(id,status) {
  if(!confirm(status==="approved"?"Zatwierdzić tę pieczątkę?":"Odrzucić tę pieczątkę?"))return;
  const {error}=await db.from("stamps").update({status,reviewed_at:new Date().toISOString()}).eq("id",id);
  if(error){toast("Nie udało się zmienić statusu: "+error.message,true);return;}
  toast(status==="approved"?"Pieczątka zatwierdzona.":"Pieczątka odrzucona.");
  await refreshAll();await adminPage();
}
async function publishUpdate(event) {
  event.preventDefault();
  const form=event.currentTarget;
  const {error}=await db.from("updates").insert({
    title:form.title.value.trim(),content:form.content.value.trim(),
    published:true,created_by:state.user.id
  });
  if(error){toast("Nie udało się opublikować: "+error.message,true);return;}
  toast("Aktualność opublikowana.");
  await loadUpdates();await adminPage();
}
async function deleteUpdate(id) {
  if(!confirm("Na pewno usunąć tę aktualność?"))return;
  const {error}=await db.from("updates").delete().eq("id",id);
  if(error){toast("Nie udało się usunąć: "+error.message,true);return;}
  toast("Aktualność usunięta.");await loadUpdates();await adminPage();
}

async function render() {
  state.route=currentRoute();
  setNav();
  if(needConfig())return;
  if(state.route==="/logowanie"||state.route==="/rejestracja") {
    authPage(state.route==="/rejestracja"?"register":"login");return;
  }
  if(state.route==="/") {homePage();return;}
  if(state.route==="/ranking") {rankingPage();return;}
  if(state.route==="/aktualnosci") {updatesPage();return;}
  if(!state.user) {go("/logowanie");toast("Zaloguj się, aby otworzyć tę stronę.");return;}
  if(state.route==="/ksiazeczka") {
    await loadStamps();collectionPage();
    for(const s of state.stamps) {
      const url=await signedPhoto(s.photo_path);
      const el=document.getElementById("photo-"+s.id);
      if(el)el.innerHTML=url?`<img src="${esc(url)}" alt="Pieczątka z ${esc(s.place_name)}">`:"Nie udało się wczytać zdjęcia";
    }
    return;
  }
  if(state.route==="/dodaj-pieczatke") {await addStampPage();return;}
  if(state.route==="/profil") {await loadProfile();await loadAchievements();profilePage();return;}
  if(state.route==="/admin") {await adminPage();return;}
  $("#appMain").innerHTML=`<div class="empty"><h3>Nie znaleziono strony</h3><button class="btn btn-primary" onclick="go('/')">Wróć na start</button></div>`;
}
async function refreshAll() {
  await refreshSession();
  await Promise.all([loadUpdates(),loadRanking()]);
  if(state.user)await Promise.all([loadStamps(),loadAchievements()]);
  setNav();
}
window.addEventListener("hashchange",render);

(async function init(){
  if(!db){render();return;}
  await refreshAll();
  db.auth.onAuthStateChange(async (_event,session)=>{
    state.session=session;state.user=session?.user||null;
    if(state.user)await loadProfile();else state.profile=null;
    setNav();
    if(state.route==="/")homePage();else render();
  });
  await render();
})();
</script>
</body>
</html>
